name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Mínimo privilegio: el flujo solo puede leer el repositorio
permissions:
  contents: read

jobs:
  pruebas:
    name: Compilar y probar ${{ matrix.servicio }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        servicio: [menu-ms, pedidos-ms]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar, ejecutar pruebas y medir cobertura
        working-directory: ${{ matrix.servicio }}
        run: mvn -B verify
      - name: Guardar informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-${{ matrix.servicio }}
          path: ${{ matrix.servicio }}/target/site/jacoco

  seguridad:
    name: Análisis de seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Buscar secretos (claves, tokens) subidos por error
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Buscar vulnerabilidades en dependencias y Dockerfiles (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          # Bloquea el merge si hay vulnerabilidades CRÍTICAS con parche disponible.
          # Las de severidad ALTA las corrige Dependabot con sus Pull Requests semanales.
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
